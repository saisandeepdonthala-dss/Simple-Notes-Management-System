<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNM Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            radial-gradient(circle at top left,#7f5af0,#2cb67d),
            linear-gradient(135deg,#16161a,#242629);
            padding:20px;
        }

        .container{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        form{
            width:100%;
            max-width:420px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.2);
            padding:40px 35px;
            border-radius:25px;
            box-shadow:0 15px 35px rgba(0,0,0,0.35);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:white;
            font-size:32px;
            letter-spacing:1px;
        }

        .input-box{
            margin-bottom:22px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            font-weight:600;
            color:#f1f1f1;
        }

        input{
            width:100%;
            padding:14px 16px;
            border:none;
            outline:none;
            border-radius:14px;
            background:rgba(255,255,255,0.18);
            color:white;
            font-size:15px;
            transition:0.3s ease;
        }

        input::placeholder{
            color:#dcdcdc;
        }

        input:focus{
            background:rgba(255,255,255,0.25);
            box-shadow:0 0 0 3px rgba(127,90,240,0.4);
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#7f5af0,#2cb67d);
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s ease;
            margin-top:10px;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 20px rgba(0,0,0,0.25);
        }

        .flash-box{
            background:rgba(255,77,77,0.18);
            border:1px solid rgba(255,77,77,0.4);
            color:#ffe3e3;
            padding:14px;
            border-radius:14px;
            margin-bottom:22px;
            text-align:center;
            font-size:14px;
        }

        .forgot-link{
            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            color:white;
            font-size:14px;
            transition:0.3s;
        }

        .forgot-link:hover{
            color:#2cb67d;
        }

        @media(max-width:500px){

            form{
                padding:30px 22px;
            }

            h1{
                font-size:26px;
            }

        }

    </style>

</head>
<body>

    <div class="container">

        <form method="POST">

            <h1>SNM Login</h1>

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    <div class="flash-box">

                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}

                    </div>

                {% endif %}
            {% endwith %}

            <div class="input-box">

                <label>User Email</label>

                <input 
                    type="email"
                    name="useremail"
                    placeholder="Enter User Email"
                    required
                >

            </div>

            <div class="input-box">

                <label>User Password</label>

                <input 
                    type="password"
                    name="userpassword"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <button type="submit">
                Login
            </button>

            <a href="{{url_for('forgot')}}" class="forgot-link">
                Forgot Password?
            </a>

        </form>

    </div>

</body>
</html>
