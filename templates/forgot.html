<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='forgot.css') }}">
</head>

<body>

    <form method="POST">

        <h2>Forgot Password</h2>

        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for msg in messages %}
                        <li>{{ msg }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <label>Enter Email</label>

        <input 
            type="email"
            name="useremail"
            placeholder="Enter Your Email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

</body>
</html>
