<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register SNM</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;

            background:
            linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);

            overflow:hidden;
            position:relative;
        }

        /* BACKGROUND EFFECT */

        body::before{
            content:'';
            position:absolute;
            width:300px;
            height:300px;
            background:#38bdf8;
            border-radius:50%;
            top:-100px;
            left:-80px;
            filter:blur(90px);
            opacity:0.4;
        }

        body::after{
            content:'';
            position:absolute;
            width:280px;
            height:280px;
            background:#8b5cf6;
            border-radius:50%;
            bottom:-100px;
            right:-70px;
            filter:blur(90px);
            opacity:0.4;
        }

        .container{
            width:100%;
            display:flex;
            justify-content:center;
            align-items:center;
            position:relative;
            z-index:1;
        }

        form{
            width:100%;
            max-width:430px;

            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.12);

            padding:38px;

            border-radius:24px;

            box-shadow:
            0 15px 40px rgba(0,0,0,0.35);
        }

        h1{
            text-align:center;
            margin-bottom:28px;
            color:white;
            font-size:32px;
            font-weight:700;
            letter-spacing:1px;
        }

        .input-box{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;

            color:#e5e7eb;

            font-size:14px;
            font-weight:500;
        }

        input{
            width:100%;

            padding:14px 16px;

            border:none;
            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.12);

            color:white;

            font-size:15px;

            transition:0.3s ease;
        }

        input::placeholder{
            color:#cbd5e1;
        }

        input:focus{
            background:rgba(255,255,255,0.18);

            box-shadow:
            0 0 0 3px rgba(56,189,248,0.25);
        }

        button{
            width:100%;

            padding:14px;

            border:none;
            border-radius:14px;

            background:linear-gradient(135deg,#38bdf8,#6366f1);

            color:white;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s ease;

            margin-top:10px;
        }

        button:hover{
            transform:translateY(-3px);

            box-shadow:
            0 12px 24px rgba(59,130,246,0.35);
        }

        .flash-box{
            background:rgba(255,77,77,0.18);

            border:1px solid rgba(255,77,77,0.35);

            color:#ffe4e6;

            padding:13px;

            border-radius:14px;

            margin-bottom:22px;

            text-align:center;

            font-size:14px;
        }

        @media(max-width:500px){

            form{
                padding:28px 22px;
            }

            h1{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <form method="POST">

            <h1>SNM Register</h1>

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    <div class="flash-box">

                        {% for message in messages %}
                            <p>{{ message }}</p>
                        {% endfor %}

                    </div>

                {% endif %}
            {% endwith %}

            <div class="input-box">

                <label>User Name</label>

                <input 
                    type="text"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

            </div>

            <div class="input-box">

                <label>User Email</label>

                <input 
                    type="email"
                    name="useremail"
                    placeholder="Enter User Email"
                    required
                >

            </div>

            <div class="input-box">

                <label>User Password</label>

                <input 
                    type="password"
                    name="userpassword"
                    placeholder="Enter Password"
                    required
                >

            </div>

            <div class="input-box">

                <label>User Phone Number</label>

                <input 
                    type="text"
                    name="userphone_no"
                    placeholder="Enter Phone Number"
                    maxlength="10"
                    required
                >

            </div>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
