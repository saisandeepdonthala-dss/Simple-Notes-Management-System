<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:420px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            margin-bottom:10px;
            color:#333;
        }

        p{
            margin-bottom:25px;
            color:#666;
            font-size:15px;
        }

        .otp-box{
            display:flex;
            justify-content:space-between;
            gap:10px;
            margin-bottom:30px;
        }

        .otp-input{
            width:50px;
            height:55px;
            border:2px solid #ccc;
            border-radius:10px;
            text-align:center;
            font-size:22px;
            outline:none;
            transition:0.3s;
        }

        .otp-input:focus{
            border-color:#4facfe;
            box-shadow:0 0 8px rgba(53, 1, 46, 0.69);
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            background:#4facfe;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2196f3;
        }

    </style>
</head>
<body>

    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <ul class=flashes>
        {% for messages in messages %}
        <b>{{ messages }}</b>
        {% endfor %}
        </ul>
        {% endif %}
        {% endwith %}

        <h1>OTP Verification</h1>

        <p>Enter Your 6 Character OTP</p>
        <form  method="POST">


            <div class="otp-box">
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
            </div>

            <!-- Hidden Input -->
            <input type="hidden" name="otp" id="fullOtp">

            <button type="submit">
                Verify OTP
            </button>

        </form>

    </div>

    <script>

        const inputs = document.querySelectorAll(".otp-input");
        const hiddenInput = document.getElementById("fullOtp");

        inputs.forEach((input, index) => {

            input.addEventListener("input", () => {

                input.value = input.value.replace(/[^A-Za-z0-9]/g, "");

                if(input.value && index < inputs.length - 1){
                    inputs[index + 1].focus();
                }

                let otp = "";

                inputs.forEach(box => {
                    otp += box.value;
                });

                hiddenInput.value = otp;
            });

        });

    </script>

</body>
</html>
